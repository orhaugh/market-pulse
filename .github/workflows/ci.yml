# market-pulse CI: consume the pinned clink release exactly the way the
# README tells a human to, then run everything that runs without Docker:
# generate the tape, run the eight SQL scenes with their oracle + golden
# checks, build the native app against the installed package, run its
# clink::test_support tests, run the anomaly detector, and run the
# state-as-data and replay scenes.
#
# The clink install (pinned toolchain + engine) is cached on the release
# tag, so only the first run after a version bump pays the build.
#
# A dispatch can run it against another clink: clink_version names a release
# tag, clink_sdk_run a clink release-binaries dry run, whose SDK tarball (and
# commit) is tested instead. clink's scripts/check-showcases.sh dispatches
# that for a release candidate before it is tagged.

name: ci
# A dispatched run names the clink it ran against; push and pull request runs
# keep their usual name.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('ci on clink {0}', inputs.clink_sdk_run && format('SDK run {0}', inputs.clink_sdk_run) || inputs.clink_version || 'pin') || '' }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clink_version:
        description: A clink release tag to run against instead of the pin
        default: ""
      clink_sdk_run:
        description: A clink release-binaries dry run (its run id) whose SDK to run against
        default: ""

env:
  CLINK_VERSION: ${{ inputs.clink_version || 'v0.15.0' }}
  # Build the pinned Arrow without the object-store filesystems (s3://,
  # gs://, abfs://) - nothing here uses them, and it is what lets the
  # toolchain build on a bare runner: the prebuilt archive's Arrow was
  # compiled against an aws-sdk living at /usr/local, which only clink's
  # build image and install-system-deps.sh provide. The cost is a one-off
  # from-source Arrow build, paid only when the cache key rolls.
  CLINK_ARROW_OBJECT_STORES: "OFF"
  # clink and iceberg-cpp are C++23 (std::ranges::to and friends);
  # ubuntu-24.04's default gcc-13 lacks the library side, gcc-14 has it.
  CC: gcc-14
  CXX: g++-14
  # A no-object-store Arrow cannot link iceberg-cpp (its bundle references
  # Arrow's S3 symbols unconditionally), and nothing here uses Iceberg.
  CLINK_SKIP_ICEBERG: "1"

jobs:
  scenes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Not for a clink under test: it installs over the cached prefix, and
      # a save after a cache miss would file that install under the pin.
      - name: Restore the pinned clink install
        if: ${{ !inputs.clink_sdk_run }}
        id: clink-cache
        uses: actions/cache@v4
        with:
          path: |
            .clink
            ~/.clink-deps
          key: clink-${{ env.CLINK_VERSION }}-${{ runner.os }}-${{ runner.arch }}-obj${{ env.CLINK_ARROW_OBJECT_STORES }}-gcc14-v2

      - name: Build tooling and clink's system dependencies
        # The -dev packages are what clink's pinned Arrow expects on the
        # host (its ArrowConfig resolves CURL, OpenSSL, zstd et al at
        # consumer-configure time; libcurl4-openssl-dev is the one the
        # stock runner image is missing).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential g++-14 git curl ca-certificates pkg-config \
            libssl-dev libcurl4-openssl-dev libsqlite3-dev libxml2-dev \
            libzstd-dev zlib1g-dev

      - name: Fetch the clink SDK under test
        if: inputs.clink_sdk_run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.clink_sdk_run }}
        run: |
          gh run download "${RUN}" -R orhaugh/clink -n clink-linux-x86_64-ubuntu24.04 -D "${RUNNER_TEMP}/clink-sdk"
          sdk="$(ls "${RUNNER_TEMP}"/clink-sdk/clink-*.tar.gz)"
          commit="$(gh api "repos/orhaugh/clink/actions/runs/${RUN}" --jq .head_sha)"
          echo "CLINK_SDK=${sdk}" >> "${GITHUB_ENV}"
          echo "CLINK_COMMIT=${commit}" >> "${GITHUB_ENV}"
          echo "clink under test: $(basename "${sdk}") from run ${RUN}, commit ${commit}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Install clink (the pin, or the clink under test)
        run: scripts/get-clink.sh

      - name: Run the SQL scenes (oracle + golden checks)
        run: scripts/run-scenes.sh

      - name: Build the native app against the installed package
        run: |
          cmake -S app -B app/build -DCMAKE_PREFIX_PATH=$PWD/.clink/prefix
          cmake --build app/build --parallel 4

      - name: Operator tests (clink::test_support)
        run: ctest --test-dir app/build --output-on-failure

      - name: Run the anomaly detector, expect exactly the injected fat finger
        run: |
          ./app/build/mp_anomaly
          python3 - <<'PY'
          import json
          alerts = [json.loads(l) for l in open("out/alerts.ndjson")]
          ff = json.load(open("data/manifest.json"))["incidents"]["fat_finger"]
          assert len(alerts) == 1, f"expected 1 alert, got {len(alerts)}"
          assert alerts[0]["trade_id"] == ff["trade_id"], (alerts, ff)
          print("alert matches the injected incident:", alerts[0])
          PY

      - name: State-as-data scene
        run: |
          python3 -m pip install --quiet pyarrow
          scripts/scene-state-as-data.sh

      - name: Replay scene
        run: scripts/scene-replay.sh

      - name: Python scene (pyclink over libclink)
        # pyclink installs from the python/ subdirectory of the pinned tag,
        # or of the commit under test - the
        # SDK fast path never materialises a source checkout, and the SDK
        # already carries the libclink.so the package drives.
        run: |
          CLINK_LIB=$PWD/.clink/prefix/lib/libclink.so \
            python3 -m pip install --quiet pyarrow "git+https://github.com/orhaugh/clink@${CLINK_COMMIT:-${CLINK_VERSION}}#subdirectory=python"
          CLINK_LIB=$PWD/.clink/prefix/lib/libclink.so python3 python/candles.py
