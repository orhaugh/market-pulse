# market-pulse distributed scene: one clink Coordinator, two Workers, and a
# single-node Kafka - enough to run the same candles SQL that scene 01 runs
# embedded, distributed at parallelism 4 over real topics.
#
# The clink runtime image is the one published from the pinned release; set
# CLINK_IMAGE to override (e.g. a locally built clink-runtime:latest).
#
#   cluster/run.sh         # brings this up, loads the tape, submits, gates
#   open http://localhost:8081   # the coordinator dashboard

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"   # host listener (the loader pipes the tape in here)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://kafka:19092,CONTROLLER://kafka:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  coordinator:
    image: ${CLINK_IMAGE:-ghcr.io/orhaugh/clink-runtime:0.4.0}
    # The published runtime image is linux/amd64 only; declaring it here keeps
    # Kafka native everywhere and runs the clink services emulated on arm64.
    platform: linux/amd64
    command: >
      clink_node --role=coordinator --port=6123
                 --bind-host=0.0.0.0 --advertise-host=coordinator
                 --http-port=8081 --http-bind=0.0.0.0
    ports:
      - "8081:8081"   # dashboard + HTTP API (the scene submits through this)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/v1/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  worker1:
    image: ${CLINK_IMAGE:-ghcr.io/orhaugh/clink-runtime:0.4.0}
    platform: linux/amd64
    command: >
      clink_node --role=worker --id=worker-1
                 --coordinator-host=coordinator --coordinator-port=6123
                 --data-host=worker1 --slots=16
    environment:
      CLINK_DATA_BIND_HOST: 0.0.0.0
    depends_on:
      coordinator:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure

  worker2:
    image: ${CLINK_IMAGE:-ghcr.io/orhaugh/clink-runtime:0.4.0}
    platform: linux/amd64
    command: >
      clink_node --role=worker --id=worker-2
                 --coordinator-host=coordinator --coordinator-port=6123
                 --data-host=worker2 --slots=16
    environment:
      CLINK_DATA_BIND_HOST: 0.0.0.0
    depends_on:
      coordinator:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
